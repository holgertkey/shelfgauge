[package]
name = "shelfgauge"
version = "0.16.0+005"
edition = "2024"
license = "MIT"
description = "Index a folder of ebooks (FB2, EPUB, plain text and HTML, plain and zipped) and browse it in a local web library"
repository = "https://github.com/holgertkey/shelfgauge"
readme = "README.md"
keywords = ["ebook", "fb2", "epub", "txt", "html"]
categories = ["command-line-utilities", "web-programming::http-server"]
exclude = [".github/"]
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
base64 = "0.23.1"
chardetng = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
encoding_rs = "0.8.42"
html5ever = "0.40.1"
http-body-util = "0.1.5"
ignore = "0.4.33"
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rayon = "1.12.0"
roxmltree = "0.21.1"
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "signal", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma"] }
uuid = { version = "1.28.0", features = ["v4"] }
toml_edit = "0.25.17"
argon2 = "0.6.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
serde_json = "1.0.152"
unicode-normalization = "0.1.26"
rpassword = "7.5.4"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }

# Argon2 (profile PINs) is far too slow unoptimized: tests hash and verify PINs.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Smaller binary at the cost of a longer build. Panics must keep unwinding: request
# handlers and parser threads catch them (`panic = "abort"` would end the server).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
