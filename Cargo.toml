[package]
name = "shelfgauge"
version = "0.1.0+001"
edition = "2024"
license = "MIT"
description = "Index a folder of ebooks (FB2, plain and zipped) and browse it in a local web library"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
