[package]
name = "shelfgauge"
version = "0.1.0+005"
edition = "2024"
license = "MIT"
description = "Index a folder of ebooks (FB2, plain and zipped) and browse it in a local web library"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
chardetng = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.152"
tempfile = "3.27.0"
