name: Release

# Pushing a version tag (`v1.2.3`, matching `MAJOR.MINOR.PATCH` in Cargo.toml) builds
# the binaries, creates the GitHub release and publishes both crates to crates.io
# (`shelfgauge-core` first, then `shelfgauge`, which depends on it).
# Publishing needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io API token
# with the publish-update scope for both crates; publish-new for a crate's first
# version).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the version in Cargo.toml
        run: |
          for crate in shelfgauge shelfgauge-core; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            base="${version%%+*}"
            if [ "v$base" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the $crate version $version"
              exit 1
            fi
          done
      - run: cargo test --locked

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          name="shelfgauge-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md CHANGELOG.md LICENSE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp target/release/shelfgauge.exe "$name/"
            7z a "$name.zip" "$name"
          else
            cp target/release/shelfgauge "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: shelfgauge-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 7
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          changelog="https://github.com/${GH_REPO}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
          cat > notes.md <<EOF
          The changes in this version are listed in [CHANGELOG.md](${changelog}).

          Binaries: Linux (x86_64), Windows (x86_64), macOS (Apple Silicon).
          From crates.io: \`cargo install shelfgauge\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "shelfgauge ${GITHUB_REF_NAME}" \
            --notes-file notes.md

  crates-io:
    name: publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Drop the local build number from the version
        # `+BUILD` is a local development counter (see CLAUDE.md); crates.io gets
        # the plain MAJOR.MINOR.PATCH. The first `version =` line is the one in
        # `[workspace.package]`, which both crates inherit. Only this checkout is changed.
        run: |
          base="${GITHUB_REF_NAME#v}"
          sed -i -E "0,/^version = \".*\"/s//version = \"${base}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
      # Publishes the workspace members one by one in dependency order. Cargo waits
      # only a minute for an uploaded crate to reach the index, and the index can lag
      # far longer (v0.20.0: core was accepted, but missing from the index for nearly
      # 20 minutes, so shelfgauge was never published). So a crate whose version
      # crates.io already has is skipped, which makes a rerun of this job safe, and
      # each crate is awaited in the sparse index (up to an hour) before the next.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          agent="shelfgauge-release (https://github.com/${GITHUB_REPOSITORY})"
          published() {
            curl -sf -A "$agent" "https://crates.io/api/v1/crates/$1/${version}" >/dev/null
          }
          in_index() {
            curl -sf "https://index.crates.io/${1:0:2}/${1:2:2}/$1" \
              | grep -q "\"vers\":\"${version}\""
          }
          for crate in shelfgauge-core shelfgauge; do
            if published "$crate"; then
              echo "$crate ${version} is already on crates.io, skipped"
            else
              cargo publish -p "$crate" --allow-dirty
            fi
            for _ in $(seq 120); do
              in_index "$crate" && break
              echo "waiting for $crate ${version} in the index"
              sleep 30
            done
            in_index "$crate" || { echo "::error::$crate ${version} is not in the index"; exit 1; }
          done
