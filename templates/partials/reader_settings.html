<div id="reader-settings" class="reader-settings" popover aria-label="Reading settings" lang="en">
<form class="settings-form">
  <fieldset class="setting swatches">
    <legend>Theme</legend>
    <label class="swatch swatch-auto" title="Auto"><input type="radio" name="theme" value=""><span>Auto</span></label>
    <label class="swatch swatch-light" title="Light"><input type="radio" name="theme" value="light"><span>Light</span></label>
    <label class="swatch swatch-sepia" title="Sepia"><input type="radio" name="theme" value="sepia"><span>Sepia</span></label>
    <label class="swatch swatch-mist" title="Mist"><input type="radio" name="theme" value="mist"><span>Mist</span></label>
    <label class="swatch swatch-dusk" title="Dusk"><input type="radio" name="theme" value="dusk"><span>Dusk</span></label>
    <label class="swatch swatch-dark" title="Dark"><input type="radio" name="theme" value="dark"><span>Dark</span></label>
    <label class="swatch swatch-navy" title="Navy"><input type="radio" name="theme" value="navy"><span>Navy</span></label>
    <label class="swatch swatch-forest" title="Forest"><input type="radio" name="theme" value="forest"><span>Forest</span></label>
    <label class="swatch swatch-wine" title="Wine"><input type="radio" name="theme" value="wine"><span>Wine</span></label>
    <label class="swatch swatch-custom" title="Custom"><input type="radio" name="theme" value="custom"><span>Custom</span></label>
  </fieldset>
  <fieldset class="setting theme-pair" hidden>
    <legend>Auto follows the system: by day and at night</legend>
    <div class="swatches pair-row">
      <span class="pair-label">Day</span>
      <label class="swatch swatch-light" title="Light"><input type="radio" name="tlight" value="light"><span>Light</span></label>
      <label class="swatch swatch-sepia" title="Sepia"><input type="radio" name="tlight" value="sepia"><span>Sepia</span></label>
      <label class="swatch swatch-mist" title="Mist"><input type="radio" name="tlight" value="mist"><span>Mist</span></label>
      <label class="swatch swatch-custom" title="Custom"><input type="radio" name="tlight" value="custom"><span>Custom</span></label>
    </div>
    <div class="swatches pair-row">
      <span class="pair-label">Night</span>
      <label class="swatch swatch-dark" title="Dark"><input type="radio" name="tdark" value="dark"><span>Dark</span></label>
      <label class="swatch swatch-dusk" title="Dusk"><input type="radio" name="tdark" value="dusk"><span>Dusk</span></label>
      <label class="swatch swatch-navy" title="Navy"><input type="radio" name="tdark" value="navy"><span>Navy</span></label>
      <label class="swatch swatch-forest" title="Forest"><input type="radio" name="tdark" value="forest"><span>Forest</span></label>
      <label class="swatch swatch-wine" title="Wine"><input type="radio" name="tdark" value="wine"><span>Wine</span></label>
      <label class="swatch swatch-custom" title="Custom"><input type="radio" name="tdark" value="custom"><span>Custom</span></label>
    </div>
    <p class="setting-note pair-note" hidden></p>
  </fieldset>
  <fieldset class="setting theme-colors" hidden>
    <legend>Custom colors</legend>
    <label class="color-field"><input type="color" name="cbg"><span>Background</span></label>
    <label class="color-field"><input type="color" name="caccent"><span>Accent</span></label>
    <p class="setting-note colors-note" hidden></p>
  </fieldset>
  <fieldset class="setting fonts">
    <legend>Font</legend>
    <label><input type="radio" name="font" value="sans"><span class="font-sans">Sans</span></label>
    <label><input type="radio" name="font" value="serif"><span class="font-serif">Serif</span></label>
    <label><input type="radio" name="font" value="literata"><span class="font-literata">Literata</span></label>
    <label><input type="radio" name="font" value="pt-serif"><span class="font-pt-serif">PT Serif</span></label>
    <label><input type="radio" name="font" value="merriweather"><span class="font-merriweather">Merriweather</span></label>
    <label><input type="radio" name="font" value="lora"><span class="font-lora">Lora</span></label>
    <label><input type="radio" name="font" value="inter"><span class="font-inter">Inter</span></label>
    <label><input type="radio" name="font" value="jetbrains-mono"><span class="font-jetbrains-mono">JetBrains Mono</span></label>
  </fieldset>
  <fieldset class="setting stepper size" data-name="size">
    <legend>Size</legend>
    <button type="button" data-step="-1" title="Smaller (-)" aria-label="Smaller">A−</button>
    <output class="step-value size-value" aria-live="polite"></output>
    <button type="button" data-step="1" title="Larger (+)" aria-label="Larger">A+</button>
  </fieldset>
  <fieldset class="setting stepper" data-name="leading">
    <legend>Line spacing</legend>
    <button type="button" data-step="-1" title="Tighter" aria-label="Tighter">−</button>
    <output class="step-value" aria-live="polite"></output>
    <button type="button" data-step="1" title="Looser" aria-label="Looser">+</button>
  </fieldset>
  <fieldset class="setting stepper" data-name="width">
    <legend>Width</legend>
    <button type="button" data-step="-1" title="Narrower" aria-label="Narrower">−</button>
    <output class="step-value" aria-live="polite"></output>
    <button type="button" data-step="1" title="Wider" aria-label="Wider">+</button>
  </fieldset>
  <fieldset class="setting">
    <legend>Alignment</legend>
    <label><input type="radio" name="align" value="left"><span>Left</span></label>
    <label><input type="radio" name="align" value="justify"><span>Justify</span></label>
  </fieldset>
  <fieldset class="setting awake">
    <legend>Keep screen on</legend>
    <label><input type="radio" name="awake" value="off"><span>Off</span></label>
    <label><input type="radio" name="awake" value="5"><span>5 min</span></label>
    <label><input type="radio" name="awake" value="10"><span>10 min</span></label>
    <label><input type="radio" name="awake" value="30"><span>30 min</span></label>
    <p class="setting-note" hidden>Not available here: it needs HTTPS and a recent browser.</p>
  </fieldset>
  <div class="settings-foot">
    <div class="toggles">
      <label class="focus-toggle"><input type="checkbox" name="focus"> Focus mode <kbd>f</kbd></label>
      <label class="focus-toggle"><input type="checkbox" name="status" value="on"> Header and status line</label>
    </div>
    <button type="button" class="settings-reset">Defaults</button>
  </div>
</form>
</div>
